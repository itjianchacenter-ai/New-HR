<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>JIANCHA HR Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600;700&family=IBM+Plex+Sans+Thai:wght@400;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff4dc;--card:#fff;--ink:#4e2d23;--soft:#6b422c;--faint:#875635;--line:#ebceac;--gold:#bf7e46;--red:#a43e2e}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"DB Helvethaica X","Anuphan","IBM Plex Sans Thai",system-ui,sans-serif}
.wrap{min-height:100%;display:grid;place-items:center;padding:24px calc(20px + env(safe-area-inset-right)) 24px calc(20px + env(safe-area-inset-left))}
.box{width:100%;max-width:420px;text-align:center}
img.logo{height:40px}
.pp{font-family:"IBM Plex Mono",monospace;font-size:.7rem;letter-spacing:.3em;color:var(--gold);text-transform:uppercase;margin:4px 0 30px}
h1{font-size:1.35rem;margin:0 0 6px}
p.d{color:var(--soft);font-size:.9rem;margin:0 0 24px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;text-align:left}
label{font-size:.84rem;font-weight:700;color:var(--soft)}
input{width:100%;margin-top:8px;padding:14px;border:1px solid var(--line);border-radius:13px;font:inherit;font-family:"IBM Plex Mono",monospace;font-size:.92rem}
.row{display:flex;gap:10px;margin-top:12px}
button{flex:1;padding:14px;border-radius:13px;font:inherit;font-weight:700;cursor:pointer;border:1px solid var(--line);background:var(--card)}
button.p{background:var(--ink);color:#fff;border-color:var(--ink)}
#msg{font-size:.84rem;margin-top:10px;min-height:20px;color:var(--soft)}
.spin{margin:26px auto 12px;width:34px;height:34px;border:3px solid var(--line);border-top-color:var(--gold);border-radius:50%;animation:r 1s linear infinite}
@keyframes r{to{transform:rotate(360deg)}}
.hide{display:none}
</style>
</head>
<body>
<div class="wrap"><div class="box">
  <img class="logo" src="logo-wide.png" alt="JIANCHA"/>
  <div class="pp">Admin</div>

  <div id="connecting" class="hide">
    <div class="spin"></div>
    <p class="d" id="connTxt">กำลังเชื่อมต่อหลังบ้าน…</p>
    <button style="max-width:220px" onclick="showSetup()">⚙️ ตั้งค่าเซิร์ฟเวอร์</button>
  </div>

  <div id="setup" class="hide">
    <h1>ระบบหลังบ้าน HR</h1>
    <p class="d">ระบุที่อยู่เซิร์ฟเวอร์ระบบ JC People ก่อนใช้งาน</p>
    <div class="panel">
      <label>🖥 เซิร์ฟเวอร์ระบบ HR</label>
      <input id="url" type="url" placeholder="เช่น https://hr.jianchatea.com"/>
      <div class="row">
        <button onclick="test()">ทดสอบ</button>
        <button class="p" onclick="save()">บันทึก & เปิดหลังบ้าน</button>
      </div>
      <div id="msg"></div>
    </div>
  </div>
</div></div>

<script>
const $ = s => document.querySelector(s);
// ── สองภาษา ──
const LANGL = localStorage.getItem('jc_lang') || 'th';
const TT = LANGL === 'en' ? {
  'ระบบหลังบ้าน HR': 'HR Back Office',
  'ระบุที่อยู่เซิร์ฟเวอร์ระบบ JC People ก่อนใช้งาน': 'Enter your JC People server address to begin',
  '🖥 เซิร์ฟเวอร์ระบบ HR': '🖥 HR Server', 'ทดสอบ': 'Test', 'บันทึก & เปิดหลังบ้าน': 'Save & open back office',
  'กำลังเชื่อมต่อหลังบ้าน…': 'Connecting to back office…', '⚙️ ตั้งค่าเซิร์ฟเวอร์': '⚙️ Server settings',
} : {};
document.addEventListener('DOMContentLoaded', () => {
  if (LANGL !== 'en') return;
  document.querySelectorAll('h1,p,label,button').forEach(el => { const t = el.textContent.trim(); if (TT[t]) el.textContent = TT[t]; });
});
const MSG = LANGL === 'en'
  ? { testing: 'Testing…', okPrefix: '✅ Connected: ', fail: '❌ Cannot connect — check URL and network', checking: 'Checking…', failNoSave: '❌ Cannot connect — not saved', reach: u => 'Cannot reach ' + u }
  : { testing: 'กำลังทดสอบ…', okPrefix: '✅ เชื่อมต่อสำเร็จ: ', fail: '❌ เชื่อมต่อไม่ได้ — ตรวจ URL และเครือข่าย', checking: 'กำลังตรวจสอบ…', failNoSave: '❌ เชื่อมต่อไม่ได้ — ยังไม่บันทึก', reach: u => 'เชื่อมต่อ ' + u + ' ไม่ได้' };
const norm = u => { let x = String(u || '').trim().replace(/\/+$/, ''); if (x && !/^https?:\/\//i.test(x)) x = 'http://' + x; return x; };
function showSetup() {
  $('#connecting').classList.add('hide');
  $('#setup').classList.remove('hide');
  $('#url').value = localStorage.getItem('jc_server') || 'https://people.jc-group-global.com';
}
async function ping(base) {
  const ctl = new AbortController();
  const t = setTimeout(() => ctl.abort(), 6000);
  try {
    const r = await fetch(base + '/api/ping', { signal: ctl.signal });
    const j = await r.json();
    return j.ok ? j : null;
  } catch { return null; } finally { clearTimeout(t); }
}
async function test() {
  const u = norm($('#url').value); if (!u) return;
  $('#msg').textContent = MSG.testing;
  const j = await ping(u);
  $('#msg').textContent = j ? MSG.okPrefix + (j.company || j.name) : MSG.fail;
}
async function save() {
  const u = norm($('#url').value); if (!u) return;
  $('#msg').textContent = MSG.checking;
  const j = await ping(u);
  if (!j) { $('#msg').textContent = MSG.failNoSave; return; }
  localStorage.setItem('jc_server', u);
  location.replace(u + '/admin'); // replace: กด Back จากหลังบ้าน = ออกจากแอป ไม่วนกลับ launcher
}
(async () => {
  const saved = localStorage.getItem('jc_server');
  if (!saved) return showSetup();
  $('#connecting').classList.remove('hide');
  const j = await ping(saved);
  if (j) location.replace(saved + '/admin');
  else { $('#connTxt').textContent = MSG.reach(saved); setTimeout(showSetup, 400); }
})();
</script>
</body>
</html>
